apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels:
    app: flask-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask-app

  template:
    metadata:
      labels:
        app: flask-app

    spec:
      containers:
      - name: flask-app

        image: 020866158197.dkr.ecr.us-east-1.amazonaws.com/mlops-final-project:latest

        ports:
        - containerPort: 5000

        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1"

        env:
        - name: MLOPS_DAGSHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: dagshub-secret
              key: MLOPS_DAGSHUB_TOKEN

        - name: DAGSHUB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dagshub-secret
              key: DAGSHUB_USERNAME

        - name: DAGSHUB_REPO
          valueFrom:
            secretKeyRef:
              name: dagshub-secret
              key: DAGSHUB_REPO

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service

spec:
  type: LoadBalancer

  selector:
    app: flask-app

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000